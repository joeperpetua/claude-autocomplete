name: Main Config
version: 1.0.0
schema: v1

models:
  - name: Haiku Bridge
    provider: openai
    model: claude-haiku
    apiBase: "http://localhost:11435/v1"
    apiKey: bridge
    roles:
      - autocomplete
    promptTemplates:
      autocomplete: "<fim_prefix>{{{prefix}}}<fim_suffix>{{{suffix}}}<fim_middle>"
    autocompleteOptions:
      maxPromptTokens: 1024
      debounceDelay: 250
      modelTimeout: 10000
      maxSuffixPercentage: 0.2
      prefixPercentage: 0.3
      onlyMyCode: true
    defaultCompletionOptions:
      contextLength: 32768
      maxTokens: 64

  - name: Sonnet Bridge
    provider: openai
